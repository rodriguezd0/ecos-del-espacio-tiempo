<html lang="es">
<head>

  <title>Pokémon: Ecos del Espacio-Tiempo</title>

  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { position: absolute; left: 0; top: 0; width: 512px; height: 384px; transform-origin: 0 0; }
    #stage canvas { position: absolute; left: 0; top: 0; width: 512px; height: 384px; image-rendering: pixelated; image-rendering: crisp-edges; }

    #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #b9ff66; font: 16px monospace; }
    #update-toast { position: fixed; right: 12px; bottom: 12px; padding: 8px 12px; background: rgba(20, 30, 28, .92); color: #b9ff66;
      border: 1px solid #b9ff66; font: 13px/1.3 system-ui, sans-serif; border-radius: 6px; display: none; cursor: pointer; z-index: 10; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="world" width="512" height="384"></canvas>
    <canvas id="ui" width="512" height="384"></canvas>
    <div id="boot">Cargando…</div>
  </div>
  <div id="update-toast" title="Recargar para aplicar los cambios">Actualización disponible — pulsa aquí o F5</div>
  <script type="module" src="./src/main.js"></script>
